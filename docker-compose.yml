---
services:
  frontend:
    build:
      context: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: true
      PORT: 80
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/var/app/
      - /mnt/g/vid-editor/videos/:/var/app/public/videos
      - /var/app/node_modules
  backend:
    build:
      context: ./backend
    environment:
      PORT: 80
    ports:
      - "3000:80"
    volumes:
      - ./backend/src:/var/app/src
      - ./videos/:/var/app/videos
